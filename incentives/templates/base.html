<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Incentive ledger{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f1e8;
      --sheet: #fffdf8;
      --ink: #1f2a24;
      --muted: #4f5b54;
      --rule: #d9d3c4;
      --teal: #0f6b5c;
      --teal-dark: #0a4f44;
      --copper: #b4541b;
      --alert-bg: #fbeee6;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.6 var(--sans); }
    a { color: var(--teal-dark); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible, input:focus-visible, .skip:focus { outline: 3px solid var(--copper); outline-offset: 3px; }
    .skip { position: absolute; left: -999px; top: 8px; background: var(--sheet); padding: 8px 12px; }
    .skip:focus { left: 16px; }
    .masthead { border-bottom: 2px solid var(--ink); background: var(--sheet); }
    .masthead-inner, main, .colophon { max-width: 1120px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
    .masthead-inner { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; padding-top: 14px; padding-bottom: 14px; }
    .wordmark { font: 700 1.15rem/1 var(--display); color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
    .wordmark span { color: var(--teal); }
    .source { font: .8rem var(--mono); color: var(--muted); }
    main { padding-top: 40px; padding-bottom: 56px; }
    h1, h2 { font-family: var(--display); letter-spacing: -.02em; line-height: 1.15; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin: .2em 0 .35em; }
    h2 { font-size: 1.3rem; margin: 0 0 .5em; }
    p { max-width: 68ch; }
    .kicker { font: 600 .78rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin: 0; }
    .lede { font-size: 1.1rem; color: var(--muted); }
    .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 24px; }
    .subnet-form { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
    .subnet-form .field { display: grid; gap: 4px; }
    .subnet-form label { font-weight: 600; font-size: .9rem; }
    .subnet-form input { font: 1.05rem var(--mono); width: 9.5rem; padding: 10px 12px; border: 1px solid var(--muted); border-radius: 3px; background: #fff; color: var(--ink); }
    .subnet-form input[aria-invalid="true"] { border-color: var(--copper); }
    .hint { font-size: .85rem; color: var(--muted); margin: 0; flex-basis: 100%; }
    .field-error { color: #8f3a0f; font-weight: 600; margin: 0; flex-basis: 100%; }
    button { font: 600 1rem var(--sans); background: var(--teal); color: #fff; border: 0; border-radius: 3px; padding: 11px 18px; cursor: pointer; }
    button:hover { background: var(--teal-dark); }
    button[disabled] { opacity: .75; cursor: progress; }
    .button-link { display: inline-block; background: var(--teal); color: #fff; padding: 9px 16px; border-radius: 3px; text-decoration: none; font-weight: 600; }
    .note { font-size: .85rem; color: var(--muted); }
    .colophon { border-top: 1px solid var(--rule); padding-top: 16px; padding-bottom: 32px; font-size: .85rem; color: var(--muted); }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="{% url 'home' %}">Incentive <span>ledger</span></a>
      <span class="source">source: GraphQL · subnets(netUid)</span>
    </div>
  </header>
  <main id="content">{% block content %}{% endblock %}</main>
  <footer class="colophon">Charts are drawn on the server from the provider's response. Values are shown as reported; nothing here is a forecast or a return estimate.</footer>
  <script>
    document.querySelectorAll("form.subnet-form").forEach(function (form) {
      form.addEventListener("submit", function () {
        var button = form.querySelector("button");
        button.disabled = true;
        button.textContent = "Fetching…";
        form.setAttribute("aria-busy", "true");
      });
    });
    // Pages restored from the back/forward cache keep the disabled button.
    window.addEventListener("pageshow", function () {
      document.querySelectorAll("form.subnet-form button").forEach(function (button) {
        button.disabled = false;
        button.textContent = button.dataset.label;
      });
    });
  </script>
</body>
</html>

<form class="subnet-form" method="get" action="{% url 'plot_view' %}" novalidate>
  <div class="field">
    <label for="subnet">{{ form.subnet.label }}</label>
    <input id="subnet" name="subnet" type="number" inputmode="numeric" min="0" max="65535" value="{{ form.subnet.value|default_if_none:'' }}" aria-describedby="subnet-hint{% if form.subnet.errors %} subnet-error{% endif %}"{% if form.subnet.errors %} aria-invalid="true"{% endif %}>
  </div>
  <button type="submit" data-label="{{ button_label }}">{{ button_label }}</button>
  {% if form.subnet.errors %}<p class="field-error" id="subnet-error" role="alert">{{ form.subnet.errors|first }}</p>{% endif %}
  <p class="hint" id="subnet-hint">A Bittensor netuid from 0 to 65535. Subnet {{ default_subnet }} is the configured default.</p>
</form>
